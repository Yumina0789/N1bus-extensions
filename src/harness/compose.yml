# harness 模块的容器编排。
#
# 约定（本体在动它之前会检查）：
#   * project 名由本体用 `-p n1bus-harness` 指定，所以这里**不写** name:。
#   * network 必须是 Caddy 所在的那个 —— 容器不 publish 端口，只有同一网桥上的
#     Caddy 够得到它。
#
# 端口为什么是 3081 而不是 3080：这个镜像里的 dsh 只肯绑 127.0.0.1，容器内另有
# 一个 node TCP 转发进程把 0.0.0.0:3081 转进去，所以对外要连转发口。
#
# 入口地址是**动态**的：dsh 启动时生成一次性 token，打印在容器日志里、不落盘，
# 没有 token 时一律 401。manifest 的 page.entry 声明了这件事，面板会读日志取 token
# 再拼出入口地址 —— 所以这里的 DSH_PUBLIC_URL 必须与 page.url 一致。

services:
  dsh:
    # 镜像名可用同目录 .env 里的 DSH_IMAGE 覆盖。默认指向本机镜像：
    # dsh 由本机构建，没有发布到任何公开 registry（见 README「现有模块」）。
    image: ${DSH_IMAGE:-dsh:local}
    container_name: n1bus-harness
    hostname: dsh
    init: true                 # 收僵尸进程：agent 会开不少子进程
    restart: unless-stopped
    # 宿主内存有限，给个上限别把面板挤死；超了让它自己 OOM 重启
    mem_limit: 900m
    environment:
      - TZ=Asia/Shanghai
      - DSH_HOME=/root/.dsh
      # Host / Origin 栅栏要放行的 authority（必须与浏览器地址栏一致）
      - DSH_TRUSTED_HOST=lolicon.fans
      # 浏览器实际访问的根。换了挂载路径就要跟着改，并且与本模块 page.url 一致。
      - DSH_PUBLIC_URL=https://lolicon.fans/m/harness/
      # 关掉 dsh 的内层文件沙箱。容器自己就是隔离边界，而容器里**没有任何可用的
      # 沙箱后端**：镜像里没有 bubblewrap，Docker 默认 seccomp 又挡住
      # clone(CLONE_NEWUSER)（unshare --user 直接 EPERM）。默认的 workspace-write
      # 于是每次工具调用都落在 dsh-sandbox 那句
      #   "no sandbox backend is usable on this host; refusing to run the command unconfined"
      # 上 —— 表现为「调什么工具都失败」。dsh 官方给这种情况的指引就是改用
      # danger-full-access（见 @deepseek-ai/dsh-sandbox 的报错文案）。
      #
      # 必须用这个环境变量，而**不要**去 patch 里单独改 sandbox-policy.mode：
      # dsh-base 用同一个变量同时推导 sandbox 与 approval
      #   mode:   process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
      #   policy: (同上) === 'danger-full-access' ? 'never' : 'ask'
      # 只改其中一个，permission 插件会因为 (sandbox, approval) 组合落不进任何预设
      # 而整个拒绝激活，报 "composed sandbox and approval defaults match no preset"。
      # 边界仍在：容器不 publish 端口、无 CAP_SYS_ADMIN、mem_limit 900m，
      # 且只挂载 dsh-home 卷与本模块的 workspace。
      - DSH_PERMISSION_MODE=danger-full-access
      # 模型密钥不放这里：面板会把这个目录的内容按包哈希校验，密钥应当通过 dsh
      # 自己的「设置 → 模型」填写，存在 dsh-home 卷里。
    volumes:
      - dsh-home:/root/.dsh       # 配置、会话、凭据：容器重建也不丢
      - ./workspace:/workspace    # agent 的工作区
    networks:
      - nimbus

networks:
  nimbus:
    external: true
    name: docker_default

volumes:
  # 名字写死（不是 external）：卷不存在时 compose 会自动建，而之前手工部署留下的
  # 同名卷会被直接复用 —— 会话与配置不会因为换成模块管理而丢失。
  dsh-home:
    name: dsh_dsh-home
