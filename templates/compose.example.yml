# 扩展包的 compose.yml 示例。
#
# 约定（面板会检查）：
#   * project 名必须是 n1bus-<id>，由面板在执行 ext.* 动作时用 -p 指定，
#     本文件里不要写 name:（会被命令行覆盖，写了反而让人误会）。
#   * 数据卷用**具名卷**，面板卸载时才可能连数据一起清（本轮不做卸载）。
#   * 端口绑定写 127.0.0.1，除非它本来就是给公网用的裸 TCP 服务（如 KMS 的 1688）。
#   * 与本栈之外的东西通信，接既有外部网络，别自己新建网桥。

services:
  vlmcsd:
    image: ghcr.io/yumina0789/vlmcsd:latest
    container_name: n1bus-kms-vlmcsd
    restart: unless-stopped
    ports:
      - "1688:1688"            # KMS 客户端：公网可达，且 docker-proxy 绕过 ufw
    volumes:
      - kms-data:/var/lib/nimbus
    command: ["-l", "/var/log/vlmcsd.log"]

  v1m-dash:
    image: n1bus-kms-dash:local
    container_name: n1bus-kms-dash
    restart: unless-stopped
    depends_on:
      - vlmcsd
    ports:
      - "127.0.0.1:8099:8099"  # 只给宿主：面板从这里读它的 API
    volumes:
      - kms-data:/var/lib/nimbus

volumes:
  kms-data:
