# 模块包的 compose.yml 示例。
#
# 约定（本体在动它之前会检查）：
#   * project 名必须是 n1bus-<id>，由本体在执行 module.* 动作时用 -p 指定，
#     本文件里不要写 name:（会被命令行覆盖，写了反而让人误会）。
#   * container_name 要与 manifest.json 里 log / aggregate 块的 source.container 一致。
#   * 数据卷用**具名卷**，卸载时才可能连数据一起清（卸载本轮还没做）。
#   * 端口绑定写 127.0.0.1，除非它本来就是给外网用的裸 TCP 服务（如 KMS 的 1688）。
#   * 日志给个上限：本体要读它，但别让它把磁盘吃掉。

services:
  app:
    image: ghcr.io/yumina0789/myext:latest
    container_name: n1bus-myext-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - myext-data:/var/lib/myext
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  myext-data:
