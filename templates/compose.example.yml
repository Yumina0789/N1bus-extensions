# 模块容器的编排模板。要点：
#
#   1. project 名由本体用 `-p n1bus-<id>` 指定，这里**不要**写 name:。
#   2. network 必须是 Caddy 所在的那个 —— 模块页面由 Caddy 转给容器，不挂同一个
#      网桥就找不到它。模块不需要页面时这一条可以省略。
#   3. 只写 image + container_name，**不要 build**：包内没有构建上下文，
#      而本体也不执行模块提供的任何命令（ADR 0002）。
#
#   cd src/<id> && python3 ../../tools/pack.py <id>

services:
  app:
    image: ghcr.io/example/app:latest
    container_name: n1bus-example
    hostname: app
    restart: unless-stopped
    # container_name 要与 manifest 的 page.upstream / page.entry.container 对上
    ports:
      - "127.0.0.1:8080:8080"   # 只给 Caddy 用就不要 publish
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - n1bus

networks:
  n1bus:
    external: true
    name: docker_default
